<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamca Alfabesi Çevirici v2.0</title>
    <style>
        :root {
            --ana-renk: #2c3e50;
            --vurgu-renk: #d35400;
            --kagit-renk: #fdfcf0;
        }

        body { 
            background-color: #121212; 
            color: #ecf0f1; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 900px;
        }

        h1 { 
            text-align: center; 
            color: var(--vurgu-renk);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 0;
        }

        textarea { 
            width: 100%; 
            height: 120px; 
            background: #2d2d2d;
            color: #fff;
            border: 2px solid var(--ana-renk);
            border-radius: 8px;
            padding: 15px;
            font-size: 18px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            margin-bottom: 25px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--vurgu-renk);
        }

        /* ÇIKTI ALANI (KAĞIT EFEKTİ) */
        #cikti-paneli {
            background-color: var(--kagit-renk);
            border-radius: 8px;
            padding: 40px;
            min-height: 200px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 15px; /* Kelimeler arası boşluk */
            box-shadow: inset 0 0 50px rgba(0,0,0,0.1);
            overflow-x: hidden; /* Dışarı taşmayı engeller */
        }

        /* KELİME GRUPLAMASI */
        .kelime-kutusu {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            padding: 5px;
            /* Kelimelerin bölünmemesi için: */
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* HARF RESİMLERİ */
        .kamca-harf {
            height: 55px; /* Boyutu buradan ayarla (60-70 idealdir) */
            width: auto;
            margin: 0 1px; /* Harfler arası çok küçük boşluk */
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.2));
        }

        .bilinmeyen {
            font-size: 30px;
            color: #333;
            font-weight: bold;
            margin: 0 5px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.5;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>ᛕAMCA Alfabesi</h1>
        
        <textarea id="metinGiris" oninput="temizCevir()" placeholder="Buraya gizli mesajınızı yazın..."></textarea>
        
        <div id="cikti-paneli">
            </div>

        <div class="footer">
            9000x12000px Master Kaynak Kullanılıyor | Kamca Encryption System
        </div>
    </div>

    <script>
        function temizCevir() {
            const metin = document.getElementById('metinGiris').value;
            const cikti = document.getElementById('cikti-paneli');
            cikti.innerHTML = ''; 

            if(!metin.trim()) return;

            // Kelimelere böl
            const kelimeler = metin.split(/\s+/);

            kelimeler.forEach(kelime => {
                const kelimeDiv = document.createElement('div');
                kelimeDiv.className = 'kelime-kutusu';

                for (let harf of kelime) {
                    let dosya = getDosyaAdi(harf);
                    
                    if (dosya) {
                        const img = document.createElement('img');
                        img.src = dosya;
                        img.className = 'kamca-harf';
                        // Resim yüklenemezse (dosya yoksa) harfin kendisini yaz
                        img.onerror = function() {
                            this.style.display = 'none';
                            const span = document.createElement('span');
                            span.innerText = harf;
                            span.className = 'bilinmeyen';
                            kelimeDiv.appendChild(span);
                        };
                        kelimeDiv.appendChild(img);
                    } else {
                        const span = document.createElement('span');
                        span.innerText = harf;
                        span.className = 'bilinmeyen';
                        kelimeDiv.appendChild(span);
                    }
                }
                cikti.appendChild(kelimeDiv);
            });
        }

        function getDosyaAdi(h) {
            // Senin klasöründeki tam dosya isimlerine göre eşleştirme
            const map = {
                'a': 'a.png', 'A': 'a.png',
                'b': 'b.PNG', 'B': 'b.PNG',
                'c': 'c.PNG', 'C': 'c.PNG',
                'ç': 'c-alt.PNG', 'Ç': 'c-alt.PNG',
                'd': 'd.PNG', 'D': 'd.PNG',
                'e': 'e.PNG', 'E': 'e.PNG',
                'f': 'f.PNG', 'F': 'f.PNG',
                'g': 'g.PNG', 'G': 'g.PNG',
                'ğ': 'g-alt.PNG', 'Ğ': 'g-alt.PNG',
                'h': 'h.PNG', 'H': 'h.PNG',
                'ı': 'ı.PNG', 'I': 'ı.PNG', // Noktasız I -> ok işareti (i.PNG)
                'i': 'i.png', 'İ': 'i.png', // Noktalı İ -> noktalı ok (i.png)
                'j': 'j.PNG', 'J': 'j.PNG',
                'k': 'k.PNG', 'K': 'k.PNG',
                'l': 'l.PNG', 'L': 'l.PNG',
                'm': 'm.PNG', 'M': 'm.PNG',
                'n': 'n.PNG', 'N': 'n.PNG',
                'o': 'o.PNG', 'O': 'o.PNG',
                'ö': 'o-alt.PNG', 'Ö': 'o-alt.PNG',
                'p': 'p.PNG', 'P': 'p.PNG',
                'r': 'r.PNG', 'R': 'r.PNG',
                's': 's.PNG', 'S': 's.PNG',
                'ş': 's-alt.PNG', 'Ş': 's-alt.PNG',
                't': 't.PNG', 'T': 't.PNG',
                'u': 'u.PNG', 'U': 'u.PNG',
                'ü': 'u-alt.PNG', 'Ü': 'u-alt.PNG',
                'v': 'v.PNG', 'V': 'v.PNG',
                'y': 'y.PNG', 'Y': 'y.PNG',
                'z': 'z.PNG', 'Z': 'z.PNG',
                'x': 'x.PNG', 'X': 'x.PNG',
                'q': 'q.PNG', 'Q': 'q.PNG',
                'w': 'w.PNG', 'W': 'w.PNG'
            };
            return map[h] || null;
        }
    </script>
</body>
</html>
